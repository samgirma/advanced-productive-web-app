name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Linting, Unit & Integration Tests
  # -------------------------------------------------------------
  test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Run Backend Lint (Ruff)
        run: |
          ruff check backend/app

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test_productive.db
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'github_actions_test_secret_key' }}
          N8N_WEBHOOK_SECRET: dev_n8n_secret_token_12345
        run: |
          cd backend
          python -m pytest tests -v --tb=short

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Lint
        run: |
          cd frontend
          npm ci
          npm run lint --if-present

      - name: Test Frontend Production Build
        run: |
          cd frontend
          npm run build

  # -------------------------------------------------------------
  # Job 2: Production Deployment (Render / Webhook Deploy)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not configured in GitHub Secrets. Skipping automated deploy trigger."
          else
            echo "Triggering production deploy on Render..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Deploy hook successfully dispatched."
          fi
