services:
  # -------------------------------------------------------------
  # 1. Managed PostgreSQL Database
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: productive-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: productive_db
      POSTGRES_USER: productive_user
      POSTGRES_PASSWORD: productive_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productive_user -d productive_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. FastAPI Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: productive-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://productive_user:productive_secure_password@db:5432/productive_db
      SECRET_KEY: ${SECRET_KEY:-productive_production_secret_key_change_me}
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-dev_n8n_secret_token_12345}
      UPLOAD_DIR: /app/uploads
      CHROMA_PERSIST_DIR: /app/chroma_db
    volumes:
      - backend_uploads:/app/uploads
      - backend_chroma:/app/chroma_db
      - backend_logs:/app/logs
    ports:
      - "8000:8000"

  # -------------------------------------------------------------
  # 3. React Frontend (Nginx Production Reverse Proxy)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: productive-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  postgres_data:
  backend_uploads:
  backend_chroma:
  backend_logs:
